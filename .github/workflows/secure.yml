name: 🦋 Moth Project - Security Guard

on:
  pull_request:
    branches: [ main, master ]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validar Regras e Permissões do Moth Project
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            console.log("📢 [Moth Notice] A pasta /domains é o diretório público de registros dos domínios.");
            console.log("🦋 [Moth Guard] Validando o Pull Request...");

            const prAuthor = context.payload.pull_request.user.login;
            const prTitle = context.payload.pull_request.title || "";
            console.log(`👤 Autor: ${prAuthor} | Título: ${prTitle}`);

            const domainsDir = path.join(process.cwd(), 'domains');
            if (!fs.existsSync(domainsDir)) {
              fs.mkdirSync(domainsDir, { recursive: true });
            }

            const entries = fs.readdirSync(domainsDir, { withFileTypes: true });
            const domainFolders = entries.filter(dirent => dirent.isDirectory()).map(dirent => dirent.name);

            let hasError = false;

            for (const folder of domainFolders) {
              const infoPath = path.join(domainsDir, folder, 'info.json');

              // Se a pasta é nova e não tem info.json, avisa o usuário para criar o info.json junto
              if (!fs.existsSync(infoPath)) {
                console.log(`✨ Pasta nova detectada: '${folder}'. Certifique-se de incluir o info.json com o accountOwner: "${prAuthor}"!`);
              } else {
                // Valida as regras de segurança normais
                const newContent = JSON.parse(fs.readFileSync(infoPath, 'utf8'));
                let oldContent = {};
                try {
                  const oldRaw = execSync(`git show HEAD^:domains/${folder}/info.json`).toString();
                  oldContent = JSON.parse(oldRaw);
                } catch (e) {
                  oldContent = { accountOwner: newContent.accountOwner, isSecureDomain: false };
                }

                // 1. Bloqueia alteração de dono
                if (oldContent.accountOwner && oldContent.accountOwner !== newContent.accountOwner) {
                  console.error(`❌ ERRO: O usuário '${prAuthor}' tentou alterar o 'accountOwner' do domínio '${folder}'!`);
                  hasError = true;
                }

                // 2. Bloqueia ativação de isSecureDomain sem os termos
                if (oldContent.isSecureDomain === false && newContent.isSecureDomain === true) {
                  if (!prTitle.includes('[agree-terms]')) {
                    console.error(`❌ ERRO: Tentaram mudar 'isSecureDomain' para 'true' sem a tag '[agree-terms]' no título do PR!`);
                    hasError = true;
                  }
                }
              }
            }

            if (hasError) {
              core.setFailed("🚫 [Moth Guard] Pull Request REJEITADO por violação de segurança!");
            } else {
              console.log("✨ [Moth Guard] Validação concluída com sucesso! PR aprovado. 🚀🦋");
            }
            
