name: 🦋 Moth Project - Auto Setup & Security Guard

on:
  pull_request:
    branches: [ main, master ]

jobs:
  auto-setup-and-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Gerenciar Domínios, Autoria e Segurança via YAML
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');

            console.log("🦋 [Moth Automator] Verificando novas pastas e alterações...");

            const prAuthor = context.actor;
            const prTitle = context.payload.pull_request.title || "";
            console.log(`👤 Autor do PR: ${prAuthor}`);
            console.log(`📝 Título do PR: ${prTitle}`);

            // Pega todos os arquivos modificados ou criados no PR
            let diffFiles = [];
            try {
              diffFiles = execSync('git diff --name-only HEAD^ HEAD').toString().split('\n');
            } catch (e) {
              console.log("⚠️ Executando verificação geral de arquivos criados...");
              // Caso o diff falhe, lista as pastas dentro de domains/
            }

            // Descobre pastas novas criadas em domains/ que ainda não têm info.json ou estão sendo adicionadas
            const domainsDir = path.join(process.cwd(), 'domains');
            if (!fs.existsSync(domainsDir)) {
              fs.mkdirSync(domainsDir, { recursive: true });
            }

            const domainFolders = fs.readdirSync(domainsDir, { withFileTypes: })
              .filter(dirent => dirent.isDirectory())
              .map(dirent => dirent.name);

            let hasError = false;

            for (const folder of domainFolders) {
              const folderPath = path.join(domainsDir, folder);
              const infoPath = path.join(folderPath, 'info.json');

              // SE A PASTA É NOVA E NÃO TEM info.json: O workflow cria automaticamente! 🚀
              if (!fs.existsSync(infoPath)) {
                console.log(`✨ [Auto Setup] Nova pasta de domínio detectada: '${folder}'. Gerando info.json...`);
                
                // O usuário quer o domínio confiável logo na criação? Verifica a tag [make-secure] no título do PR
                const wantSecure = prTitle.includes('[make-secure]');
                
                if (wantSecure && !prTitle.includes('[agree-terms]')) {
                  console.error(`❌ ERRO: Para criar o domínio já confiável, você precisa concordar com os termos incluindo '[agree-terms]' no título do PR junto com '[make-secure]'!`);
                  hasError = true;
                  continue;
                }

                const newInfoData = {
                  domainName: `${folder}.dest`, // Padrão inicial com o nome da pasta
                  created_at: new Date().toISOString().split('T')[0],
                  accountOwner: prAuthor, // Trava o dono automaticamente como quem abriu o PR! 🔒
                  isSecureDomain: wantSecure ? true : false, // Fica seguro se ele marcou a tag
                  pages: ["index"]
                };

                fs.writeFileSync(infoPath, JSON.stringify(newInfoData, null, 2), 'utf8');
                console.log(`✅ [Auto Setup] info.json gerado para '${folder}' com dono '${prAuthor}' e isSecureDomain: ${newInfoData.isSecureDomain}`);
                
              } else {
                // SE O ARQUIVO JÁ EXISTE: Roda as regras normais de segurança e proteção de dono
                const newContent = JSON.parse(fs.readFileSync(infoPath, 'utf8'));
                let oldContent = {};
                try {
                  const oldRaw = execSync(`git show HEAD^:domains/${folder}/info.json`).toString();
                  oldContent = JSON.parse(oldRaw);
                } catch (e) {
                  oldContent = { accountOwner: newContent.accountOwner, isSecureDomain: false };
                }

                // 1. Bloqueia alteração de dono
                if (oldContent.accountOwner && oldContent.accountOwner !== newContent.accountOwner) {
                  console.error(`❌ ERRO: O usuário '${prAuthor}' tentou alterar o 'accountOwner' do domínio '${folder}'!`);
                  hasError = true;
                }

                // 2. Bloqueia ativação de isSecureDomain sem os termos
                if (oldContent.isSecureDomain === false && newContent.isSecureDomain === true) {
                  if (!prTitle.includes('[agree-terms]')) {
                    console.error(`❌ ERRO: Tentaram mudar 'isSecureDomain' para 'true' sem aceitar os termos!`);
                    hasError = true;
                  }
                }
              }
            }

            if (hasError) {
              core.setFailed("🚫 [Moth Guard] O Pull Request foi REJEITADO por violação das regras de automação/segurança!");
            } else {
              console.log("✨ [Moth Automator] Tudo certo com os domínios! PR liberado. 🚀🦋");
            }
            
